name: Release

on:
  push:
    tags:
      - '[0-9]+'
      - '[0-9]+.[0-9]+'
      - 'v[0-9]+'
      - 'v[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build ZIP and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release tag=${TAG} version=${VERSION}"

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y zip rsync

      - name: Build release ZIP
        run: bash ./deploy.sh "${{ steps.meta.outputs.version }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ZIP="releases/swiss-parks-php-sdk-${VERSION}.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Error: missing ${ZIP}" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            echo "Updated assets on existing release ${TAG}"
          else
            gh release create "$TAG" "$ZIP" \
              --title "Swiss Parks PHP SDK ${VERSION}" \
              --generate-notes \
              --verify-tag
            echo "Created release ${TAG}"
          fi
